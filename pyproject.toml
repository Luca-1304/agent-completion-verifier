[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-completion-verifier"
version = "0.4.0"
description = "A model-agnostic evaluator for evidence-grounded AI agent completion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Luca Panayiotou"}]
keywords = ["ai-agents", "evaluation", "reliability", "tool-use", "ai-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
completion-verifier = "completion_verifier.cli:main"
completion-verifier-adapt = "completion_verifier.adapter_cli:main"
completion-verifier-benchmark = "completion_verifier.benchmark_cli:main"

[project.urls]
Repository = "https://github.com/Luca-1304/agent-completion-verifier"
Issues = "https://github.com/Luca-1304/agent-completion-verifier/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
