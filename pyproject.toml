[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-completion-verifier"
version = "0.1.0"
description = "Evidence-grounded evaluation for AI-agent completion claims"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luca Panayiotou" }]
keywords = ["ai-agents", "evaluation", "reliability", "ai-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
completion-verifier = "completion_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
