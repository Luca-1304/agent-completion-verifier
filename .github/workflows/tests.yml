name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package
        run: python -m pip install --editable .

      - name: Compile source
        run: python -m compileall -q src tests scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run release verification
        run: python scripts/verify_release.py

      - name: Run evaluator module CLI
        run: python -m completion_verifier data/cases.jsonl

      - name: Run installed evaluator CLI
        run: completion-verifier data/cases.jsonl --json > /tmp/editable-results.json

      - name: Run installed generic adapter CLI
        run: completion-verifier-adapt generic examples/generic_trace.json examples/requirements.json --source-ref editable-generic --envelope > /tmp/editable-generic-envelope.json

      - name: Run installed OpenAI-style adapter CLI
        run: completion-verifier-adapt openai examples/openai_tool_trace.json examples/requirements.json --source-ref editable-openai > /tmp/editable-openai-case.json

      - name: Run installed benchmark CLI
        run: completion-verifier-benchmark --config examples/benchmark_config.json --output /tmp/editable-benchmark > /tmp/editable-benchmark-summary.json

      - name: Run installed sandbox CLI
        run: completion-verifier-sandbox --config examples/sandbox_config.json --output /tmp/editable-sandbox --scenario all > /tmp/editable-sandbox-summary.json

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist

      - name: Verify wheel in clean environment
        run: |
          python -m venv /tmp/acv-wheel-env
          /tmp/acv-wheel-env/bin/python -m pip install --no-deps dist/*.whl
          /tmp/acv-wheel-env/bin/python -m completion_verifier data/cases.jsonl > /tmp/wheel-module.txt
          /tmp/acv-wheel-env/bin/completion-verifier data/cases.jsonl --json > /tmp/wheel-results.json
          /tmp/acv-wheel-env/bin/completion-verifier-adapt generic examples/generic_trace.json examples/requirements.json --source-ref wheel-generic --envelope > /tmp/wheel-generic-envelope.json
          /tmp/acv-wheel-env/bin/completion-verifier-adapt openai examples/openai_tool_trace.json examples/requirements.json --source-ref wheel-openai > /tmp/wheel-openai-case.json
          /tmp/acv-wheel-env/bin/completion-verifier-benchmark --config examples/benchmark_config.json --output /tmp/wheel-benchmark > /tmp/wheel-benchmark-summary.json
          /tmp/acv-wheel-env/bin/completion-verifier-sandbox --config examples/sandbox_config.json --output /tmp/wheel-sandbox --scenario all > /tmp/wheel-sandbox-summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "FAILED": 3,
              "PARTIAL": 2,
              "UNVERIFIED": 4,
              "VERIFIED_COMPLETE": 7,
          }
          for result_file in ("/tmp/editable-results.json", "/tmp/wheel-results.json"):
              payload = json.loads(Path(result_file).read_text(encoding="utf-8"))
              counts = {
                  status: sum(row["status"] == status for row in payload)
                  for status in expected
              }
              assert len(payload) == 16, (result_file, len(payload))
              assert counts == expected, (result_file, counts)

          for envelope_file, expected_ref in (
              ("/tmp/editable-generic-envelope.json", "editable-generic"),
              ("/tmp/wheel-generic-envelope.json", "wheel-generic"),
          ):
              payload = json.loads(Path(envelope_file).read_text(encoding="utf-8"))
              assert payload["source"]["source_ref"] == expected_ref
              assert len(payload["source"]["raw_sha256"]) == 64
              assert all(
                  "source_event_id" not in event["evidence"]
                  for event in payload["events"]
              )

          for case_file in (
              "/tmp/editable-openai-case.json",
              "/tmp/wheel-openai-case.json",
          ):
              payload = json.loads(Path(case_file).read_text(encoding="utf-8"))
              assert "source" not in payload
              assert payload["events"][0]["action"] == "send_email"

          from completion_verifier.benchmark import verify_manifest
          from completion_verifier.sandbox import verify_sandbox_manifest

          for summary_file in (
              "/tmp/editable-benchmark-summary.json",
              "/tmp/wheel-benchmark-summary.json",
          ):
              payload = json.loads(Path(summary_file).read_text(encoding="utf-8"))
              assert payload["total_runs"] == 24
              assert payload["manifest_verified"] is True

          assert verify_manifest(Path("/tmp/editable-benchmark"))
          assert verify_manifest(Path("/tmp/wheel-benchmark"))
          editable_metrics = Path("/tmp/editable-benchmark/metrics.json").read_bytes()
          wheel_metrics = Path("/tmp/wheel-benchmark/metrics.json").read_bytes()
          assert editable_metrics == wheel_metrics
          benchmark = json.loads(editable_metrics)
          assert benchmark["experiment"]["injected_failure_runs"] == 21
          assert benchmark["experiment"]["recovered_failure_runs"] == 5
          assert benchmark["groups"]["baseline"]["rates"]["false_completion_rate"] == 0.875
          assert abs(benchmark["groups"]["evidence_contract"]["rates"]["false_completion_rate"] - (1 / 3)) < 1e-12
          assert abs(benchmark["groups"]["verifier_feedback"]["rates"]["false_completion_rate"] - (1 / 6)) < 1e-12

          for summary_file in (
              "/tmp/editable-sandbox-summary.json",
              "/tmp/wheel-sandbox-summary.json",
          ):
              payload = json.loads(Path(summary_file).read_text(encoding="utf-8"))
              assert payload["total_scenarios"] == 8
              assert payload["manifest_verified"] is True
              assert payload["false_completion_rate"] == 0.75

          assert verify_sandbox_manifest(Path("/tmp/editable-sandbox"))
          assert verify_sandbox_manifest(Path("/tmp/wheel-sandbox"))
          editable_sandbox = Path("/tmp/editable-sandbox/metrics.json").read_bytes()
          wheel_sandbox = Path("/tmp/wheel-sandbox/metrics.json").read_bytes()
          assert editable_sandbox == wheel_sandbox
          sandbox = json.loads(editable_sandbox)
          assert sandbox["status_counts"] == {
              "VERIFIED_COMPLETE": 2,
              "PARTIAL": 0,
              "UNVERIFIED": 0,
              "FAILED": 6,
          }
          assert sandbox["claimed_completion"] == 4
          assert sandbox["false_completion"] == 3
          assert sandbox["false_completion_rate"] == 0.75
          assert sandbox["silent_verified_completion"] == 1
          assert sandbox["source_false_positive"] == 3
          assert sandbox["source_false_negative"] == 1
          assert sandbox["security_rejection"] == 2
          assert not any(path.is_symlink() for path in Path("/tmp/editable-sandbox").rglob("*"))
          assert not any(path.is_symlink() for path in Path("/tmp/wheel-sandbox").rglob("*"))
          PY

      - name: Check installed dependencies
        run: python -m pip check
