name: live runner safety and wheel verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/completion_verifier/live/**"
      - "src/completion_verifier/live_cli.py"
      - "tests/test_live.py"
      - "examples/openai_live_config.json"
      - "docs/LIVE_RUNNER.md"
      - "pyproject.toml"
      - ".github/workflows/live-runner-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/completion_verifier/live/**"
      - "src/completion_verifier/live_cli.py"
      - "tests/test_live.py"
      - "examples/openai_live_config.json"
      - "docs/LIVE_RUNNER.md"
      - "pyproject.toml"
      - ".github/workflows/live-runner-tests.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Live runner — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install base package without optional SDK
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable .

      - name: Run deterministic live-runner tests
        run: python -m unittest -v tests.test_live

      - name: Prove dry run needs no key or SDK
        env:
          OPENAI_API_KEY: ""
        run: |
          completion-verifier-live openai \
            --config examples/openai_live_config.json \
            --output /tmp/unused-live-output \
            --model test-model \
            --dry-run > /tmp/editable-live-preview.json
          test ! -e /tmp/unused-live-output

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist

      - name: Verify clean wheel without optional SDK
        env:
          OPENAI_API_KEY: ""
        run: |
          python -m venv /tmp/acv-live-wheel
          /tmp/acv-live-wheel/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          /tmp/acv-live-wheel/bin/completion-verifier-live openai \
            --config examples/openai_live_config.json \
            --output /tmp/unused-wheel-output \
            --model test-model \
            --dry-run > /tmp/wheel-live-preview.json
          test ! -e /tmp/unused-wheel-output
          /tmp/acv-live-wheel/bin/python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from completion_verifier.live import (
              FakeResponsesTransport,
              LiveRunConfig,
              replay_live_run,
              run_live,
          )

          raw = json.loads(Path("examples/openai_live_config.json").read_text(encoding="utf-8"))
          config = LiveRunConfig.from_dict(raw, model="test-model")
          tool = {
              "id": "response-tool",
              "model": "test-model",
              "status": "completed",
              "output": [{
                  "type": "function_call",
                  "call_id": "call-1",
                  "name": "write_file",
                  "arguments": json.dumps({
                      "path": config.contract.path,
                      "content": config.contract.content,
                  }),
              }],
              "usage": {"input_tokens": 10, "output_tokens": 2, "total_tokens": 12},
          }
          final = {
              "id": "response-final",
              "model": "test-model",
              "status": "completed",
              "output": [],
              "output_text": json.dumps({
                  "completion_claimed": True,
                  "summary": "completed",
              }),
              "usage": {"input_tokens": 15, "output_tokens": 3, "total_tokens": 18},
          }
          with tempfile.TemporaryDirectory() as directory:
              output = Path(directory) / "run"
              result = run_live(config, FakeResponsesTransport([tool, final]), output)
              assert result.observation.matches_contract is True
              assert result.evaluation.status.value == "VERIFIED_COMPLETE"
              assert result.usage[0]["total_tokens"] == 12
              replay = replay_live_run(output)
              assert replay["manifest_verified"] is True
              assert replay["api_call_performed"] is False
              assert replay["tool_execution_performed"] is False
          PY

      - name: Compare editable and wheel previews
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          editable = json.loads(Path("/tmp/editable-live-preview.json").read_text(encoding="utf-8"))
          wheel = json.loads(Path("/tmp/wheel-live-preview.json").read_text(encoding="utf-8"))
          assert editable == wheel
          request = editable["request"]
          assert request["store"] is False
          assert request["parallel_tool_calls"] is False
          assert request["tool_choice"] == "required"
          assert len(request["tools"]) == 1
          assert request["tools"][0]["name"] == "write_file"
          assert request["tools"][0]["strict"] is True
          PY

      - name: Check installed dependencies
        run: python -m pip check
